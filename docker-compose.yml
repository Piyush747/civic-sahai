services:
  postgres:
    image: postgres:16-alpine
    container_name: civic-sahai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: civic_sahai
      POSTGRES_USER: civic_sahai
      POSTGRES_PASSWORD: civic_sahai
    ports:
      - "5432:5432"
    volumes:
      - civic_sahai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civic_sahai -d civic_sahai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  civic_sahai_postgres_data:
